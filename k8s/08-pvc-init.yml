# PVC pour le home Superset
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-home-pvc
  namespace: superset
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Init Job (exécuté une fois)
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  namespace: superset
spec:
  template:
    spec:
      containers:
        - name: init
          image: apache/superset:6.1.0
          command: ["bash", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password changeme && superset init"]
          env:
            - name: DATABASE_HOST
              value: superset-postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_NAME
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: postgres-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: secret-key
            - name: SUPERSET_CONFIG_PATH
              value: /app/superset_config.py
          volumeMounts:
            - name: config
              mountPath: /app/superset_config.py
              subPath: superset_config.py
      restartPolicy: Never
      volumes:
        - name: config
          configMap:
            name: superset-config
  backoffLimit: 3
