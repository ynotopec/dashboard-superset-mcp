# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-redis
  namespace: superset
  labels:
    app: superset-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset-redis
  template:
    metadata:
      labels:
        app: superset-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: superset-redis
  namespace: superset
  labels:
    app: superset-redis
spec:
  selector:
    app: superset-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
