# ConfigMap pour superset_config.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: superset
data:
  superset_config.py: |
    import os

    SECRET_KEY = os.getenv("SECRET_KEY")
    SQLALCHEMY_DATABASE_URI = (
        f"postgresql+psycopg2://"
        f"{os.getenv('DATABASE_USER', 'superset')}:"
        f"{os.getenv('DATABASE_PASSWORD', '')}@"
        f"{os.getenv('DATABASE_HOST', 'superset-postgres')}:"
        f"{os.getenv('DATABASE_PORT', '5432')}/"
        f"{os.getenv('DATABASE_NAME', 'superset')}"
    )
    SQLALCHEMY_TRACK_MODIFICATIONS = False

    # Cache Redis
    CACHE_CONFIG = {
        "CACHE_TYPE": "RedisCache",
        "CACHE_REDIS_HOST": os.getenv("CACHE_REDIS_HOST", "superset-redis"),
        "CACHE_REDIS_PORT": int(os.getenv("CACHE_REDIS_PORT", "6379")),
        "CACHE_REDIS_DB": os.getenv("CACHE_REDIS_DB", "0"),
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG

    # Celery
    CELERY_CONFIG = {
        "broker_url": f"redis://{os.getenv('BROKER_REDIS_HOST', 'superset-redis')}:"
                      f"{os.getenv('BROKER_REDIS_PORT', '6379')}/"
                      f"{os.getenv('BROKER_REDIS_DB', '1')}",
        "result_backend": f"redis://{os.getenv('RESULT_BACKEND_REDIS_HOST', 'superset-redis')}:"
                          f"{os.getenv('RESULT_BACKEND_REDIS_PORT', '6379')}/"
                          f"{os.getenv('RESULT_BACKEND_REDIS_DB', '2')}",
    }

    # MCP
    MCP_AUTH_ENABLED = False
    MCP_DEV_USERNAME = "admin"

    SUPERSET_CELERY_WORKERS_CONFIG = CELERY_CONFIG
